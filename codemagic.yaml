workflows:
  ios-app-store:
    name: StatsAnaliz App Store Build
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "Apple Key"
    environment:
      xcode: latest
    scripts:
      - name: Sertifika ve Profili Mac'e Kur
        script: |
          keychain initialize
          keychain add-certificates --certificate "ios_distribution.p12" --certificate-password "123456"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "StatsAnaliz.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/
      - name: iOS Uygulamasini Derle ve Paketle
        script: |
          PROFILE_NAME=$(grep -aA1 '<key>Name</key>' "StatsAnaliz.mobileprovision" | grep '<string>' | sed -e 's/.*<string>\(.*\)<\/string>.*/\1/')
          
          # 1. Dosyayi kesin (absolute) yol ile olusturuyoruz
          cat <<EOF > "$(pwd)/export_options.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>teamID</key>
              <string>Z9ZR6Z7D8W</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.statsanaliz.app</key>
                  <string>$PROFILE_NAME</string>
              </dict>
          </dict>
          </plist>
          EOF
          
          # 2. Apple'in yerel araciyla profili zorlayarak (override) derliyoruz
          xcodebuild clean archive \
            -project "statsAnaliz.xcodeproj" \
            -scheme "statsAnaliz" \
            -configuration Release \
            -archivePath "$(pwd)/build/statsAnaliz.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGN_IDENTITY="Apple Distribution"
            
          # 3. Paketi disari aktariyoruz
          xcodebuild -exportArchive \
            -archivePath "$(pwd)/build/statsAnaliz.xcarchive" \
            -exportPath "$(pwd)/build/ios/ipa" \
            -exportOptionsPlist "$(pwd)/export_options.plist"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true